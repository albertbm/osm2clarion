# The values profiles/iceland.toml leaves to one machine. Copy this file to local/iceland.toml
# (git ignores local/) or pass it with --local FILE; build.py merges it over the profile table
# by table. Relative paths are read from the repository root.

[data]
# Required. The extract from download.geofabrik.de/europe/iceland.html.
pbf = "/path/to/iceland-latest.osm.pbf"
# Required. Staðfangaskrá (the address register) and the postcode list, both from
# Þjóðskrá Íslands, in CSV; see docs/ADDRESS-IMPORT.md.
addresses = "/path/to/Stadfangaskra.csv"
postcodes = "/path/to/postnumeraskra.csv"

# Optional, per unit. icode is the card the ICODE files are read from; the base card when
# left out. consent_cmd runs on the finished image, {img} standing for its path, for a unit
# that needs a patch the card build does not make. The profile's ME0 sets consent = "required",
# so an ME0 build fails without it.
# [units.ZE1]
# icode = "/path/to/another-ZE1-card.img"
# consent_cmd = "/path/to/tool {img}"

# Optional. One place of your own, such as your dealer, with a POI icon and a POINT record.
# street, town and house must match the address register as the card spells them, in
# capitals with accents. house_cell is the HOUSE001 file holding lon/lat:
# house_encode.file_name(*house_encode.cell_of(lon, lat)) without .DAT. tile_l1 and tile_l2
# are the icon's parcel positions (level, y0, x0, row, col, px, py) on the built road tile:
# camera_write.find_parcel(tile, lon, lat, level) gives the directory (y0 = D['y'],
# x0 = D['x']), row, col, px and py.
# [dealer]
# lon = -21.9312
# lat = 64.1457
# house_cell = "BXXXXXXX"
# road_tile = "B60R080R"
# category = 43
# name = "NAME"
# street = "STREET"
# town = "REYKJAVÍK"
# house = "1"
# icon = "0x806c"
# tile_l1 = [1, 0, 0, 0, 0, 0, 0]
# tile_l2 = [2, 0, 0, 0, 0, 0, 0]

# Optional, for the single-street test build only (build_addr_area0.py without --area):
# street: postcode, street: house number to anchor on (0 for the centroid), and the streets
# build_poicap.py keeps without --all-streets.
# [addr.poc_streets]
# "Laugavegur" = 101
# [addr.poc_anchor]
# "Laugavegur" = 1
# [poicap]
# addr_only_default = "LAUGAVEGUR"
