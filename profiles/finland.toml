# Finland, built on a QY7 (X08-02-00) European card.
#
# Finland lies inside the shipped database box, so no shift. Every Finland tile on the
# 2014 QY7 card is shared with Sweden, Norway or Estonia.

name = "finland"
description = "Finland on the 2014 QY7 European database"
country = 246            # ISO 3166 numeric; every road record carries it
format = "x08-02"        # QY7 units

[build]
# Keep the card's own background, strip the roads from every tile on the card, then rebuild
# the roads of one area from OSM. Unlike Iceland, no tile is generated from scratch.
mode = "area"
keep_names = true          # rd_build keeps the OSM name spelling
upper_names = true         # and writes it in capitals, as the factory tiles do
turn_restrictions = true
coarse_graph = true        # level-2 graph in the coarse file, so long routes can be planned
sec4 = true                # section-4 country records on the rebuilt tile
inter = true               # intersection search written from the rebuilt roads
point = true               # POI search: OSM facilities and the card's settlements, on the rebuilt roads

[source]
osm = "build/finland-latest.osm.pbf"

[areas.jyvaskyla]
# Roads of the admin_level 8 relation, one tile.
relations = [569407]
cells = ["B58R050R"]
bbox = [25.26, 61.84, 26.06, 62.43]   # lon_min, lat_min, lon_max, lat_max
# Street search: each address goes to the kunta and settlement the card's factory street
# file points to (tools/addr/settle.py). `municipality = "JYVÄSKYLÄ"` here would put every
# address under that row instead, the settlement from its postal town.

[areas.finland]
# The whole country: every cell below, rebuilt together so roads join at their edges. Land
# across the border (Sweden, Norway, Russia, Estonia) has no OSM data here and stays empty.
relations = [54224]
cells = ["B58R048R", "B58R050R", "B58R058R", "B60R048R", "B60R050R", "B68R048R", "B68R050R"]
bbox = [19.0, 59.7, 31.6, 70.1]
# Street search for the whole country, placed as above. build.py --addr-area jyvaskyla keeps
# these roads and writes street search for that area alone.

[grid]
# The cells holding Finland, as the card names them.
# Left out: build.py derives them from the boxes below and the tiles on the base card.
bbox = { lon_min = 19.0, lon_max = 31.6, lat_min = 59.7, lat_max = 70.1 }
# The mainland (west of 20.5 E is only sea) and Aland, so the cells west of 20 E and north of
# 64 N, which hold no Finnish land, stay out.
boxes = [
  { lon_min = 20.5, lon_max = 31.6, lat_min = 59.7, lat_max = 70.1 },
  { lon_min = 19.0, lon_max = 21.1, lat_min = 59.7, lat_max = 60.6 },
]

[roads]
# as the Iceland profile
simplify_metres = 2
skip = []
l2_classes = "wide"
l2_simplify_metres = 5
l2_graph = true
speed_unit = "km/h"

[addr]
# source = "register": the address CSV at [data] addresses, in the layout `register` names.
# source = "osm": addr:* tags of the OSM extract, inside `box`.
# Ryhti is Syke's national building-address register, CC BY 4.0, credit "Lähde: Syke Ryhti";
# tools/addr/pull_ryhti.py makes the CSV (see docs/ADDRESS-IMPORT.md).
source = "register"
register = "ryhti"
box = [61.84, 62.43, 25.26, 26.06]   # lat_min, lat_max, lon_min, lon_max; used by source = "osm"

[data]
# Relative paths are read from the repository root; build.py --addresses overrides.
addresses = "build/ryhti-finland.csv"

[targets]
default = "v2014"
v2014 = { label = "2014 QY7 European database", volume = "QSD-357-101" }
